# oh-my-kimi top-level settings (must be before any [table])
notify = ["node", "/Users/cheng/.local/share/mise/installs/node/24.15.0/lib/node_modules/oh-my-kimi/dist/scripts/notify-hook.js"]
model_reasoning_effort = "high"
developer_instructions = "You have oh-my-kimi installed. AGENTS.md is your orchestration brain and the main orchestration surface. Use skill/keyword routing like $name plus spawned role-specialized subagents for specialized work. Kimi custom agents are available via .kimi/agents and may be used for independent parallel subtasks within a single session or team pane. Skills are loaded from installed SKILL.md files under .kimi/skills. Treat explicit workflow tokens like $ralplan, $deep-interview, $team, and $ralph as command shims that must execute the matching installed workflow skill rather than being described as unsupported syntax. Treat installed prompts as narrower internal execution surfaces under AGENTS.md authority, even when user-facing docs prefer $name keywords."
model = "gpt-5.4"
model_context_window = 1000000
model_auto_compact_token_limit = 900000

default_model = "kimi-code/kimi-for-coding"
default_thinking = true
default_yolo = false
skip_afk_prompt_injection = false
default_plan_mode = false
default_editor = ""
theme = "dark"
show_thinking_stream = true
merge_all_available_skills = true
extra_skill_dirs = []
telemetry = true

[models."kimi-code/kimi-for-coding"]
provider = "managed:kimi-code"
model = "kimi-for-coding"
max_context_size = 262144
capabilities = ["image_in", "thinking", "video_in"]
display_name = "Kimi-k2.6"

[providers."managed:kimi-code"]
type = "kimi"
base_url = "https://api.kimi.com/coding/v1"
api_key = ""

[providers."managed:kimi-code".oauth]
storage = "file"
key = "oauth/kimi-code"

[loop_control]
max_steps_per_turn = 1000
max_retries_per_step = 3
max_ralph_iterations = 0
reserved_context_size = 50000
compaction_trigger_ratio = 0.85

[background]
max_running_tasks = 4
read_max_bytes = 30000
notification_tail_lines = 20
notification_tail_chars = 3000
wait_poll_interval_ms = 500
worker_heartbeat_interval_ms = 5000
worker_stale_after_ms = 15000
kill_grace_period_ms = 2000
keep_alive_on_exit = false
agent_task_timeout_s = 900
print_wait_ceiling_s = 3600

[notifications]
claim_stale_after_ms = 15000

[services.moonshot_search]
base_url = "https://api.kimi.com/coding/v1/search"
api_key = ""

[services.moonshot_search.oauth]
storage = "file"
key = "oauth/kimi-code"

[services.moonshot_fetch]
base_url = "https://api.kimi.com/coding/v1/fetch"
api_key = ""

[services.moonshot_fetch.oauth]
storage = "file"
key = "oauth/kimi-code"

[mcp.client]
tool_call_timeout_ms = 60000

# >>> omk managed hooks — do not edit manually
[[hooks]]
event = "PreToolUse"
matcher = "Shell"
command = "/Users/cheng/Documents/attachdrive-local-first/.omk/hooks/pre-shell-guard.sh"
timeout = 5

[[hooks]]
event = "PreToolUse"
matcher = "WriteFile|StrReplaceFile"
command = "/Users/cheng/Documents/attachdrive-local-first/.omk/hooks/protect-secrets.sh"
timeout = 5

[[hooks]]
event = "PostToolUse"
matcher = "WriteFile|StrReplaceFile"
command = "/Users/cheng/Documents/attachdrive-local-first/.omk/hooks/post-format.sh"
timeout = 20

[[hooks]]
event = "Stop"
command = "/Users/cheng/Documents/attachdrive-local-first/.omk/hooks/stop-verify.sh"
timeout = 30
# >>> end omk managed hooks
[features]
multi_agent = true
child_agents_md = true

[env]
USE_OMK_EXPLORE_CMD = "1"

[agents]
max_threads = 6
max_depth = 2

