event = "PreToolUse"
matcher = "Shell"
command = "/Users/cheng/Documents/attachdrive-local-first/.omk/hooks/pre-shell-guard.sh"
timeout = 5

[[hooks]]
event = "PreToolUse"
matcher = "WriteFile|StrReplaceFile"
command = "/Users/cheng/Documents/attachdrive-local-first/.omk/hooks/protect-secrets.sh"
timeout = 5

[[hooks]]
event = "PostToolUse"
matcher = "WriteFile|StrReplaceFile"
command = "/Users/cheng/Documents/attachdrive-local-first/.omk/hooks/post-format.sh"
timeout = 20

[[hooks]]
event = "Stop"
command = "/Users/cheng/Documents/attachdrive-local-first/.omk/hooks/stop-verify.sh"
