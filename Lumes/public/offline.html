<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lumes.pt — Offline</title>
  <style>
    body {
      background: #0c1821;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      max-width: 28rem;
      text-align: center;

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: #27272a;
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fb923c;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Sem ligação</div>
    <h1>lumes.pt está temporariamente indisponível</h1>
    <p>
      Não foi possível carregar a aplicação agora. Para emergências ligue
      <strong style="color:#f4f4f5">112</strong>. A informação mais recente
      será mostrada assim que a ligação for restabelecida.
    </p>
  </div>

</html>
