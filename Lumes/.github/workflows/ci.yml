name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  verify:
    name: Lint, tests, build, browser accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache Prisma client
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: prisma-${{ runner.os }}-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      # typecheck: `bun run build` does the same job, faster than
      # running tsc separately and skipping the cache step.
      - name: Build
        run: bun run build
        env:
          # CI doesn't need a real database; Prisma generate only
          # validates schema syntax, the actual DB is touched at
          # runtime.
          DATABASE_URL: "file:./build-test.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Lighthouse budgets
        run: bun run test:perf
        env:
          DATABASE_URL: "file:./build-test.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser accessibility matrix
        env:
          DATABASE_URL: "file:./build-test.db"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          bunx prisma db push --skip-generate
          bun run start > /tmp/lumes-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null
          bun run test:e2e:a11y
          bun run test:e2e:responsive
