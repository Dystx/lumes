name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH → VPS → deploy.sh --server (no-git server-only)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false  # don't kill an in-flight deploy

    steps:
      - name: Trigger remote deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command: |
            set -euo pipefail
            cd /opt/apps/lumes
            bash deploy/deploy.sh --server

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy failed for ${{ github.ref }}"
          # Optional: send a Slack/Discord webhook here.
          # curl -fsS -X POST "${{ secrets.SLACK_WEBHOOK }}" \
          #   -H "Content-Type: application/json" \
          #   -d "{\"text\": \"🚨 lumes.pt deploy failed on ${{ github.sha }}\"}"

  verify:
    name: Require CI verification
    uses: ./.github/workflows/ci.yml
