name: Lumes Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - "Lumes/**"
      - ".github/workflows/lumes-ci.yml"
      - ".github/workflows/lumes-deploy.yml"
      - ".github/workflows/lumes-lighthouse.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: Lumes

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache Prisma client
        uses: actions/cache@v4
        with:
          path: |
            Lumes/node_modules/.prisma
            Lumes/node_modules/@prisma/client
          key: prisma-lhci-${{ runner.os }}-${{ hashFiles('Lumes/prisma/schema.prisma') }}
          restore-keys: |
            prisma-lhci-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:./build-test.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Prepare isolated empty database
        run: bunx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./build-test.db"

      - name: Run Lighthouse CI
        run: bun run test:perf
        env:
          DATABASE_URL: "file:./build-test.db"
          NEXT_TELEMETRY_DISABLED: "1"
